version: 2

seeds:
  - name: player_display_names
    description: >
      Known-as name per player, generated by scripts/build_display_names.py
      from the source registry (rule column records how each was derived).
    config:
      column_types:
        player_id: integer
        display_name: text
        rule: text
    columns:
      - name: player_id
        tests: [unique, not_null]
      - name: display_name
        tests: [not_null]
      - name: rule
        tests:
          - accepted_values:
              arguments:
                values: [override, unglue, wrap, dedupe, short, verbatim]

  - name: match_result_corrections
    description: >
      Cited, minimal corrections to source match results (one row per match).
      Applied in silver_match_base; never invents events.
    config:
      column_types:
        match_id: integer
        home_penalty_score: integer
        away_penalty_score: integer
    columns:
      - name: match_id
        tests: [unique, not_null]
      - name: source
        tests: [not_null]
